<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAWORI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <meta name="theme-color" content="#F26B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* ✅ خلفية برتقالية ثابتة — لا تتغير مع الوضع الداكن/الفاتح */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #FF8C00 0%, #F26B0F 100%);
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader.hide { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .brand img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 30px;
      border: 2px solid #FFFFFF;
      background: #111111;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    .brand .title {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 900;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- ✅ شاشة تحميل بهوية فاوري: شعار + اسم + مؤشر -->
  <div class="loader" id="loader">
    <div class="brand">
      <img src="assets/assets/images/logo.webp" alt="FAWORI"
           onerror="this.style.display='none'">
      <div class="title">شركة فاورِي</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const l = document.getElementById('loader');
      if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 300); }
    });
  </script>
</body>
</html>
