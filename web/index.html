<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAWORI</title>

  <!-- ✅ منع الكاش تماماً -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <meta name="theme-color" content="#F26B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EFF2F7;
    }
    body.dark { background: #141419; }

    /* ✅ spinner بسيط جداً — بدون شعار أو نص */
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.25s;
    }
    .loader.hide { opacity: 0; pointer-events: none; }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(15, 157, 147, 0.2);
      border-top-color: #0F9D93;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    try {
      if (localStorage.getItem('isDark') === 'true') {
        document.body.classList.add('dark');
      }
    } catch (_) {}
  </script>
</head>
<body>
  <!-- ✅ Spinner صامت فقط — لا شعار، لا نص -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- ✅ cache-busting: كل بناء له رقم فريد يتجاوز الكاش -->
  <script src="flutter_bootstrap.js?v=20260918" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const l = document.getElementById('loader');
      if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 250); }
    });
  </script>
</body>
</html>
