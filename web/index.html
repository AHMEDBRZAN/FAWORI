<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAWORI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <meta name="theme-color" content="#F26B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* ✅ تدرج برتقالي فاتح احترافي — ثابت لا يتغير */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #FFA149 0%, #F98A2B 55%, #F26B0F 100%);
    }

    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader.hide { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* ✅ شعار أكبر */
    .brand img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 36px;
      border: 3px solid #FFFFFF;
      background: #111111;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.30);
    }

    /* ✅ اسم لاتيني ثابت — لا يتشوه أبداً — أغمق وأكبر */
    .brand .title {
      color: #3B1A00;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(59, 26, 0, 0.25);
      border-top-color: #3B1A00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="brand">
      <img src="assets/assets/images/logo.webp" alt="FAWORI"
           onerror="this.style.display='none'">
      <div class="title">FAWORI</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const l = document.getElementById('loader');
      if (l) { l.classList.add('hide'); setTimeout(() => l.remove(), 300); }
    });
  </script>
</body>
</html>
