<!DOCTYPE html>
<html lang="ar">
<head>
  <!-- ✅ سطر إلزامي لـ Flutter build -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAWORI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <meta name="theme-color" content="#F26B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    /* خلفية فقط — بدون أي loader أو شعار */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #EFF2F7;
    }
    body.dark { background: #141419; }
  </style>

  <script>
    /* ✅ المفتاح الصحيح: flutter.isDark — لتلوين الخلفية قبل أول إطار بدون وميض */
    try {
      if ((localStorage.getItem('flutter.isDark') || 'false') == 'true') {
        document.body.classList.add('dark');
      }
    } catch (_) {}
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
