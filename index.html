<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAWORI - محاكي الألوان الاحترافي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #E8651A;
            --primary-dark: #C5541A;
            --dark: #1a1a1a;
            --darker: #0a0a0a;
            --gray: #2a2a2a;
            --light-gray: #3a3a3a;
            --text: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            background: var(--darker);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, var(--dark) 0%, var(--gray) 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(232, 101, 26, 0.2);
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            color: white;
            letter-spacing: 3px;
        }

        .logo span {
            color: var(--primary);
        }

        .icon-btn {
            background: var(--gray);
            border: 2px solid var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        /* ===== Main Container ===== */
        .simulator-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .simulator-title {
            text-align: center;
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 900;
        }

        .simulator-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 18px;
        }

        .main-simulator {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            background: var(--dark);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        /* ===== Room Preview ===== */
        .room-preview-area {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        .room-image-container {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 15px;
        }

        .room-base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            transition: filter 0.3s;
        }

        .wall-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .wall-overlay.living-room {
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 60%,
                rgba(0,0,0,0.1) 100%
            );
        }

        .wall-overlay.bedroom {
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 50%,
                rgba(0,0,0,0.1) 100%
            );
        }

        .wall-overlay.kitchen {
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 70%,
                rgba(0,0,0,0.1) 100%
            );
        }

        .wall-overlay.bathroom {
            background: linear-gradient(
                to bottom,
                transparent 0%,
                transparent 65%,
                rgba(0,0,0,0.1) 100%
            );
        }

        .room-furniture-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 48px;
            opacity: 0.7;
            pointer-events: none;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: var(--primary);
            z-index: 10;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
        }

        .loading.active {
            display: block;
        }

        /* ===== Controls Panel ===== */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-section {
            background: var(--gray);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--light-gray);
        }

        .control-section h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--primary);
            font-weight: 700;
        }

        /* Room Type Selector */
        .room-types {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .room-type-btn {
            padding: 15px;
            background: var(--dark);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 14px;
            color: white;
            font-weight: 600;
        }

        .room-type-btn .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .room-type-btn.active, .room-type-btn:hover {
            border-color: var(--primary);
            background: var(--light-gray);
            transform: translateY(-2px);
        }

        /* Color Palette */
        .color-palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            padding: 5px;
        }

        .color-btn {
            padding: 15px 10px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
            font-weight: bold;
            font-size: 13px;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        }

        .color-btn.active {
            border-color: white;
            transform: scale(1.08);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* Slider Controls */
        .slider-control {
            margin-bottom: 18px;
        }

        .slider-control label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .slider-control input[type="range"] {
            width: 100%;
            height: 8px;
            background: var(--dark);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-control input[type="range"]::-webkit-slider-thumb {
            width: 22px;
            height: 22px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            -webkit-appearance: none;
            box-shadow: 0 2px 8px rgba(232, 101, 26, 0.5);
        }

        .slider-value {
            text-align: left;
            font-size: 13px;
            color: var(--primary);
            margin-top: 5px;
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            background: var(--dark);
            border: 2px solid var(--primary);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .action-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        /* Color Info */
        .color-info {
            background: var(--dark);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            border-right: 4px solid var(--primary);
        }

        .color-info h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .color-info p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Saved Colors */
        .saved-colors {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--light-gray);
        }

        .saved-colors h4 {
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--primary);
        }

        .saved-color-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: var(--dark);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .saved-color-item:hover {
            background: var(--light-gray);
            transform: translateX(-5px);
        }

        .saved-color-preview {
            width: 35px;
            height: 35px;
            border-radius: 6px;
            border: 2px solid white;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .main-simulator {
                grid-template-columns: 1fr;
            }
            
            .room-image-container {
                height: 400px;
            }

            .simulator-title {
                font-size: 28px;
            }
        }

        @media (max-width: 768px) {
            .room-image-container {
                height: 300px;
            }

            .color-palette {
                grid-template-columns: repeat(2, 1fr);
            }

            .room-types {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-simulator {
            animation: fadeIn 0.5s ease;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="icon-btn" onclick="goBack()">
            <span>←</span>
            <span>عودة</span>
        </button>
        <div class="logo">FA<span>WO</span>RI</div>
        <button class="icon-btn" onclick="showInfo()">
            <span>ℹ️</span>
            <span>معلومات</span>
        </button>
    </div>

    <div class="simulator-container">
        <h1 class="simulator-title">🎨 محاكي الألوان الاحترافي</h1>
        <p class="simulator-subtitle">جرب ألوان FAWORI على غرف حقيقية قبل الشراء</p>

        <div class="main-simulator">
            <!-- Room Preview -->
            <div class="room-preview-area">
                <div class="room-image-container" id="roomContainer">
                    <img src="" alt="Room" class="room-base-image" id="roomImage">
                    <div class="wall-overlay living-room" id="wallOverlay"></div>
                    <div class="room-furniture-overlay" id="furnitureEmoji">🛋️</div>
                </div>
                <div class="loading" id="loading">جاري التحميل...</div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <!-- Room Type Selection -->
                <div class="control-section">
                    <h3>🏠 اختر نوع الغرفة</h3>
                    <div class="room-types">
                        <button class="room-type-btn active" onclick="changeRoomType('living', this)">
                            <span class="icon">🛋️</span>
                            غرفة معيشة
                        </button>
                        <button class="room-type-btn" onclick="changeRoomType('bedroom', this)">
                            <span class="icon">🛏️</span>
                            غرفة نوم
                        </button>
                        <button class="room-type-btn" onclick="changeRoomType('kitchen', this)">
                            <span class="icon">🍳</span>
                            مطبخ
                        </button>
                        <button class="room-type-btn" onclick="changeRoomType('bathroom', this)">
                            <span class="icon">🚿</span>
                            حمام
                        </button>
                    </div>
                </div>

                <!-- Color Selection -->
                <div class="control-section">
                    <h3>🎨 اختر اللون</h3>
                    <div class="color-palette" id="colorPalette">
                        <button class="color-btn active" style="background: #E8651A;" onclick="applyColor('#E8651A', this)" data-color="برتقالي دافئ">
                            برتقالي
                        </button>
                        <button class="color-btn" style="background: #4169E1;" onclick="applyColor('#4169E1', this)" data-color="أزرق ملكي">
                            أزرق
                        </button>
                        <button class="color-btn" style="background: #228B22;" onclick="applyColor('#228B22', this)" data-color="أخضر طبيعي">
                            أخضر
                        </button>
                        <button class="color-btn" style="background: #808080;" onclick="applyColor('#808080', this)" data-color="رمادي عصري">
                            رمادي
                        </button>
                        <button class="color-btn" style="background: #F5DEB3; color: #333;" onclick="applyColor('#F5DEB3', this)" data-color="بيج دافئ">
                            بيج
                        </button>
                        <button class="color-btn" style="background: #FFFFFF; color: #333;" onclick="applyColor('#FFFFFF', this)" data-color="أبيض ناصع">
                            أبيض
                        </button>
                        <button class="color-btn" style="background: #191970;" onclick="applyColor('#191970', this)" data-color="كحلي فاخر">
                            كحلي
                        </button>
                        <button class="color-btn" style="background: #C1440E;" onclick="applyColor('#C1440E', this)" data-color="ترأكوتا">
                            ترأكوتا
                        </button>
                        <button class="color-btn" style="background: #8B4513;" onclick="applyColor('#8B4513', this)" data-color="بني دافئ">
                            بني
                        </button>
                        <button class="color-btn" style="background: #FFD700; color: #333;" onclick="applyColor('#FFD700', this)" data-color="ذهبي">
                            ذهبي
                        </button>
                        <button class="color-btn" style="background: #DDA0DD;" onclick="applyColor('#DDA0DD', this)" data-color="وردي فاتح">
                            وردي
                        </button>
                        <button class="color-btn" style="background: #2F4F4F;" onclick="applyColor('#2F4F4F', this)" data-color="رمادي غامق">
                            فحمي
                        </button>
                    </div>
                </div>

                <!-- Advanced Controls -->
                <div class="control-section">
                    <h3>⚙️ إعدادات متقدمة</h3>
                    
                    <div class="slider-control">
                        <label>شدة اللون:</label>
                        <input type="range" min="0" max="100" value="70" id="intensitySlider" oninput="updateIntensity(this.value)">
                        <div class="slider-value" id="intensityValue">70%</div>
                    </div>

                    <div class="slider-control">
                        <label>الشفافية:</label>
                        <input type="range" min="0" max="100" value="85" id="opacitySlider" oninput="updateOpacity(this.value)">
                        <div class="slider-value" id="opacityValue">85%</div>
                    </div>

                    <div class="slider-control">
                        <label>الإضاءة:</label>
                        <input type="range" min="50" max="150" value="100" id="brightnessSlider" oninput="updateBrightness(this.value)">
                        <div class="slider-value" id="brightnessValue">100%</div>
                    </div>

                    <div class="action-buttons">
                        <button class="action-btn" onclick="resetSettings()">🔄 إعادة تعيين</button>
                        <button class="action-btn" onclick="saveColor()">💾 حفظ اللون</button>
                    </div>
                </div>

                <!-- Color Info -->
                <div class="color-info" id="colorInfo">
                    <h4>اللون الحالي:</h4>
                    <p id="colorName">برتقالي دافئ - FAWORI Orange</p>
                    <p style="margin-top: 8px; font-size: 12px;">المنتج: Silikonlu Mat - دهان داخلي</p>
                </div>

                <!-- Saved Colors -->
                <div class="saved-colors" id="savedColorsSection" style="display: none;">
                    <h4>🎨 الألوان المحفوظة:</h4>
                    <div id="savedColorsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Room Images - Generated High Quality Images
        const roomImages = {
            living: 'https://images.unsplash.com/photo-1600210492486-7d4fe5e9ff5d?w=1200',
            bedroom: 'https://images.unsplash.com/photo-1616594039964-40891a909d99?w=1200',
            kitchen: 'https://images.unsplash.com/photo-1556911220-bff31c812dba?w=1200',
            bathroom: 'https://images.unsplash.com/photo-1620626012053-1c9c0f0a1e1f?w=1200'
        };

        const furnitureEmojis = {
            living: '🛋️',
            bedroom: '🛏️',
            kitchen: '🍳',
            bathroom: '🚿'
        };

        let currentRoom = 'living';
        let currentColor = '#E8651A';
        let savedColors = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadRoomImage('living');
            loadSavedColors();
        });

        function loadRoomImage(roomType) {
            const img = document.getElementById('roomImage');
            const overlay = document.getElementById('wallOverlay');
            const loading = document.getElementById('loading');
            
            loading.classList.add('active');
            
            img.src = roomImages[roomType];
            
            // Update overlay class
            overlay.className = 'wall-overlay ' + roomType + '-room';
            
            img.onload = function() {
                loading.classList.remove('active');
            };

            img.onerror = function() {
                loading.textContent = 'حدث خطأ في تحميل الصورة';
                setTimeout(() => {
                    loading.classList.remove('active');
                }, 2000);
            };

            // Apply current color
            setTimeout(() => {
                const activeBtn = document.querySelector('.color-btn.active');
                if (activeBtn) {
                    applyColor(currentColor, activeBtn);
                }
            }, 500);
        }

        function changeRoomType(roomType, btn) {
            currentRoom = roomType;
            
            // Update buttons
            document.querySelectorAll('.room-type-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Update furniture emoji
            document.getElementById('furnitureEmoji').textContent = furnitureEmojis[roomType];
            
            // Load new image
            loadRoomImage(roomType);
        }

        function applyColor(color, btn) {
            currentColor = color;
            const overlay = document.getElementById('wallOverlay');
            const intensity = document.getElementById('intensitySlider').value / 100;
            const opacity = document.getElementById('opacitySlider').value / 100;
            
            // Update active button
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // Get color name
            const colorName = btn.getAttribute('data-color') || 'لون مخصص';
            document.getElementById('colorName').textContent = colorName;
            
            // Apply color with blend mode
            overlay.style.background = color;
            overlay.style.opacity = opacity;
            
            // Adjust based on intensity
            if (intensity < 0.5) {
                overlay.style.mixBlendMode = 'screen';
            } else if (intensity > 0.7) {
                overlay.style.mixBlendMode = 'multiply';
            } else {
                overlay.style.mixBlendMode = 'overlay';
            }
        }

        function updateOpacity(value) {
            document.getElementById('opacityValue').textContent = value + '%';
            const overlay = document.getElementById('wallOverlay');
            overlay.style.opacity = value / 100;
        }

        function updateIntensity(value) {
            document.getElementById('intensityValue').textContent = value + '%';
            const overlay = document.getElementById('wallOverlay');
            
            if (value < 50) {
                overlay.style.mixBlendMode = 'screen';
            } else if (value > 70) {
                overlay.style.mixBlendMode = 'multiply';
            } else {
                overlay.style.mixBlendMode = 'overlay';
            }
        }

        function updateBrightness(value) {
            document.getElementById('brightnessValue').textContent = value + '%';
            const img = document.getElementById('roomImage');
            img.style.filter = `brightness(${value}%)`;
        }

        function resetSettings() {
            document.getElementById('opacitySlider').value = 85;
            document.getElementById('intensitySlider').value = 70;
            document.getElementById('brightnessSlider').value = 100;
            
            updateOpacity(85);
            updateIntensity(70);
            updateBrightness(100);
            
            const activeBtn = document.querySelector('.color-btn.active');
            if (activeBtn) {
                applyColor(currentColor, activeBtn);
            }
        }

        function saveColor() {
            const colorName = document.getElementById('colorName').textContent;
            const colorData = {
                color: currentColor,
                name: colorName,
                room: currentRoom,
                date: new Date().toLocaleDateString('ar-SA')
            };
            
            savedColors.push(colorData);
            localStorage.setItem('fawori_saved_colors', JSON.stringify(savedColors));
            displaySavedColors();
            
            alert('✅ تم حفظ اللون بنجاح!');
        }

        function loadSavedColors() {
            const saved = localStorage.getItem('fawori_saved_colors');
            if (saved) {
                savedColors = JSON.parse(saved);
                displaySavedColors();
            }
        }

        function displaySavedColors() {
            const section = document.getElementById('savedColorsSection');
            const list = document.getElementById('savedColorsList');
            
            if (savedColors.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            list.innerHTML = savedColors.map((item, index) => `
                <div class="saved-color-item" onclick="loadSavedColor(${index})">
                    <div class="saved-color-preview" style="background: ${item.color}"></div>
                    <div>
                        <div style="font-weight: bold; font-size: 13px;">${item.name}</div>
                        <div style="font-size: 11px; color: #888;">${item.room} - ${item.date}</div>
                    </div>
                </div>
            `).join('');
        }

        function loadSavedColor(index) {
            const item = savedColors[index];
            const colorBtn = Array.from(document.querySelectorAll('.color-btn')).find(
                btn => btn.getAttribute('data-color') === item.name
            );
            
            if (colorBtn) {
                applyColor(item.color, colorBtn);
            }
            
            const roomBtn = Array.from(document.querySelectorAll('.room-type-btn'))[
                ['living', 'bedroom', 'kitchen', 'bathroom'].indexOf(item.room)
            ];
            
            if (roomBtn) {
                changeRoomType(item.room, roomBtn);
            }
        }

        function goBack() {
            if (confirm('هل تريد العودة للصفحة الرئيسية؟')) {
                window.location.href = 'index.html';
            }
        }

        function showInfo() {
            alert(`🎨 محاكي الألوان الاحترافي من FAWORI

✨ الميزات:
- تجربة الألوان على غرف حقيقية
- 4 أنواع غرف مختلفة
- 12 لون متنوع
- تحكم بالشفافية والإضاءة
- حفظ الألوان المفضلة

💡 نصيحة: جرب الألوان الفاتحة للغرف الصغيرة والداكنة للجدران المميزة`);
        }
    </script>
</body>
</html>
